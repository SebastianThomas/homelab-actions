name: Headscale connect
description: >-
  Join the Headscale tailnet on a GitHub runner so the job can reach private
  MagicDNS names and a tailnet-only Kubernetes API. Thin wrapper over
  tailscale/github-action that bakes in the login-server + accept-dns convention
  and a per-run node name. Ephemeral node, auto-logout on job end. Usage: see
  the repo README.

inputs:
  auth-key:
    description: >
      Headscale pre-auth key. Create it reusable + ephemeral with a long expiry:
        headscale preauthkeys create --user <id> --reusable --ephemeral --expiration 100y
    required: true
  login-server:
    description: Headscale control server URL (e.g. https://headscale.example.com).
    required: true
  hostname:
    description: >
      Tailnet node name. Empty = gha-<repo>-<run_id>-<attempt>, unique per run
      so concurrent deploys from the same repo don't fight over one node.
    required: false
    default: ""
  ping:
    description: >
      MagicDNS name to `tailscale ping` right after joining, as a connectivity
      gate (e.g. "kube-cp-01"). Empty = skip.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: cfg
      shell: bash
      run: |
        set -euo pipefail
        name='${{ inputs.hostname }}'
        if [ -z "$name" ]; then
          # DNS-label-safe repo slug (lowercase, non-alnum -> '-', squeezed)
          repo=$(printf '%s' "${GITHUB_REPOSITORY##*/}" \
            | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' \
            | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # keep the unique suffix whole; trim the repo part to fit 63 chars
          max=$(( 63 - 4 - 1 - ${#suffix} ))
          name="gha-${repo:0:$max}-${suffix}"
        fi
        echo "hostname=$name" >> "$GITHUB_OUTPUT"

    - uses: tailscale/github-action@v4
      with:
        authkey: ${{ inputs.auth-key }}
        hostname: ${{ steps.cfg.outputs.hostname }}
        # --accept-dns so the runner resolves *.ts.<domain> via MagicDNS.
        args: --login-server=${{ inputs.login-server }} --accept-dns
        ping: ${{ inputs.ping }}
