name: Headscale connect
description: >-
  Join the Headscale tailnet on a GitHub runner so the job can reach private
  MagicDNS names and a tailnet-only Kubernetes API. Installs tailscale and runs
  `tailscale up` directly (no tailscale/github-action wrapper - that deprecates
  authkeys in favour of Tailscale-SaaS OAuth clients, which Headscale has no
  equivalent for). Ephemeral node, per-run name, bounded connectivity check.
  Usage: see the repo README.

inputs:
  auth-key:
    description: >
      Headscale pre-auth key. Create it reusable + ephemeral with a long expiry:
        headscale preauthkeys create --user <id> --reusable --ephemeral --expiration 100y
    required: true
  login-server:
    description: Headscale control server URL (e.g. https://headscale.example.com).
    required: true
  hostname:
    description: >
      Tailnet node name. Empty = gha-<repo>-<run_id>-<attempt>, unique per run
      so concurrent deploys from the same repo don't fight over one node.
    required: false
    default: ""
  ping:
    description: >
      MagicDNS name to reach via `tailscale ping` right after joining, as a
      connectivity gate (e.g. "kube-cp-01"). Fails the step after ~2 min if
      unreachable. Empty = skip.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: cfg
      shell: bash
      run: |
        set -euo pipefail
        name='${{ inputs.hostname }}'
        if [ -z "$name" ]; then
          # DNS-label-safe repo slug (lowercase, non-alnum -> '-', squeezed)
          repo=$(printf '%s' "${GITHUB_REPOSITORY##*/}" \
            | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' \
            | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # keep the unique suffix whole; trim the repo part to fit 63 chars
          max=$(( 63 - 4 - 1 - ${#suffix} ))
          name="gha-${repo:0:$max}-${suffix}"
        fi
        echo "hostname=$name" >> "$GITHUB_OUTPUT"

    - name: Join the Headscale tailnet
      shell: bash
      env:
        TS_AUTHKEY: ${{ inputs.auth-key }}
        LOGIN_SERVER: ${{ inputs.login-server }}
        TS_HOSTNAME: ${{ steps.cfg.outputs.hostname }}
        PING_TARGET: ${{ inputs.ping }}
      run: |
        set -euo pipefail

        command -v tailscale >/dev/null || curl -fsSL https://tailscale.com/install.sh | sh

        # Ephemeral: Headscale drops the node once this runner disconnects (the
        # hosted VM is destroyed at job end), so there's no logout to run.
        sudo tailscale up \
          --login-server="$LOGIN_SERVER" \
          --authkey="$TS_AUTHKEY" \
          --hostname="$TS_HOSTNAME" \
          --accept-dns \
          --timeout=60s

        [ -n "$PING_TARGET" ] || exit 0
        echo "Waiting for $PING_TARGET over the tailnet..."
        for _ in $(seq 1 30); do
          if tailscale ping -c 1 --timeout 3s "$PING_TARGET" >/dev/null 2>&1; then
            echo "$PING_TARGET reachable"; exit 0
          fi
          sleep 2
        done
        echo "::error::$PING_TARGET not reachable over the tailnet after ~2 min"
        tailscale ping -c 1 "$PING_TARGET" || true
        tailscale status || true
        exit 1
