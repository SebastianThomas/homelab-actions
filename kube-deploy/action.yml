name: Deploy to homelab k8s
description: >-
  Write a kubeconfig from the shared app-deployer token, apply the app's own
  manifests (deploy/ dir - kustomize or plain yaml, with the literal $APP_IMAGE
  substituted for `image`), then wait for the rollout. Run headscale-connect
  first when the cluster API is tailnet-only. Usage: see the repo README.

inputs:
  server:
    description: Kubernetes API URL (the KUBE_API secret).
    required: true
  ca:
    description: >
      Base64 cluster CA cert - the `ca.crt` value straight from the
      deployer-token Secret (already base64), i.e. the KUBE_CA secret.
    required: true
  token:
    description: The `deployer` ServiceAccount token (the KUBE_TOKEN secret).
    required: true
  namespace:
    description: >
      Target namespace. Also the default rollout target (deployment/<namespace>),
      per the homelab convention app-name = namespace = Deployment name.
    required: true
  manifests:
    description: Directory in the caller repo with the manifests (+ optional kustomization.yaml).
    required: false
    default: deploy
  image:
    description: Image ref substituted for ${APP_IMAGE}. Empty = no substitution.
    required: false
    default: ""
  wait:
    description: Run `kubectl rollout status` after apply.
    required: false
    default: "true"
  rollout:
    description: Rollout target to wait on. Empty = deployment/<namespace>.
    required: false
    default: ""
  rollout-timeout:
    description: Passed to `kubectl rollout status --timeout`.
    required: false
    default: 180s

runs:
  using: composite
  steps:
    - uses: azure/setup-kubectl@v5

    - name: Write kubeconfig
      shell: bash
      run: |
        umask 077 && mkdir -p ~/.kube
        cat > ~/.kube/config <<EOF
        apiVersion: v1
        kind: Config
        clusters:
          - name: homelab
            cluster:
              server: ${{ inputs.server }}
              certificate-authority-data: ${{ inputs.ca }}
        users:
          - name: deployer
            user:
              token: ${{ inputs.token }}
        contexts:
          - name: homelab
            context: { cluster: homelab, user: deployer, namespace: ${{ inputs.namespace }} }
        current-context: homelab
        EOF

    - name: Render + apply
      shell: bash
      env:
        APP_IMAGE: ${{ inputs.image }}
        NS: ${{ inputs.namespace }}
        SRC: ${{ inputs.manifests }}
        DO_WAIT: ${{ inputs.wait }}
        ROLLOUT: ${{ inputs.rollout }}
        TIMEOUT: ${{ inputs.rollout-timeout }}
      run: |
        set -euo pipefail
        if [ -f "${SRC}/kustomization.yaml" ]; then
          render() { kubectl kustomize "${SRC}"; }
        else
          # `---` before each file so plain multi-doc manifests concatenate safely.
          render() { for f in "${SRC}"/*.yaml "${SRC}"/*.yml; do [ -e "$f" ] || continue; echo '---'; cat "$f"; done; }
        fi
        render | envsubst '$APP_IMAGE' | kubectl apply -n "${NS}" -f -
        if [ "${DO_WAIT}" = "true" ]; then
          kubectl -n "${NS}" rollout status "${ROLLOUT:-deployment/${NS}}" --timeout="${TIMEOUT}"
        fi
